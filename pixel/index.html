<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+DK+Uloopet+Guides&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Pixel Art</h1>
        
    </header>
    
    <main>
        
    <div class="config">
        <div class="color-picker-group">
            <div class="preview"></div>
            <input type="color" id="addcolor">
        </div>
        <div class="buttons-row">
            <button onclick="adicionar()">Adicionar</button>
            <button onclick="remover()">Remover</button>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="tela" width="640" height="640"></canvas>
    </div>

    <div class="ferramentas">
        <div class="input-group">
            <p>Altura(Px)</p>
            <input type="number" id="altura">
        </div>
        <div class="input-group">
            <p>Largura(Px)</p>
            <input type="number" id="largura">
        </div>
        <button onclick="redimencionar()">Redimensionar</button>
    </div>

    </div>   
</main>
    
    
    
    <div id="paleta" class="paleta-container">

    </div>
    <button id="salvar" onclick="salvar()" class="botao-salvar">salvar</button>
    
    
    <script src="script.js"></script>
</body>
</html>
